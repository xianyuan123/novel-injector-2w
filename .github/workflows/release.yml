name: release

# 打 v* tag 时：跑全套测试 → 按清单打 zip → 上传为 Release 资产。
# 上传用 runner 自带的 gh（不引第三方 action，少一处供应链风险）。
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  # ⚠️ 产物名固定，不要跟着 tag 变：
  # SillyTavern 用 zip 文件名当安装目录名，改名等于换安装目录、配置会丢。
  # 所以 tag 可以是 v2026.10.29 / v1.2.3 任意形式，zip 名字永远是这个。
  ZIP_NAME: novel-injector-2026-10-17.zip

jobs:
  # 复用 tests.yml 的同一套测试作为发布门禁（少一个绿灯就发不出去）。
  # 想改成「打 tag 直接发、不跑测试」，删掉下面 release 的 needs 即可。
  tests:
    uses: ./.github/workflows/tests.yml

  release:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 环境信息
        run: |
          node --version
          python3 --version

      # 打包 + 自检都在这一步：
      #  · zip 内只放清单里的 23 个文件，路径是相对路径、无外层目录（ST 要求）
      #  · 顺序与 _zip_files.json 完全一致（FILES 是那份清单的原样拷贝）
      #  · 打包后重新打开 zip 比对 namelist()，顺序不符直接红
      #  · 目录里若有清单外的 .js/.css/.html/.md（= 新文件忘了加进清单）也红
      - name: 打包 zip（顺序与 _zip_files.json 一致，无外层目录）
        run: |
          python3 - <<'PY'
          import sys
          import zipfile
          from pathlib import Path

          # 与仓库外的 _zip_files.json（打包脚本用的那份）逐字一致、顺序一致。
          # CI 里读不到仓库外的文件，所以这里内联一份；两边若有出入，
          # 本地跑一遍 _check_zip_list.py 就能发现。
          FILES = [
              "manifest.json",
              "index.js",
              "style.css",
              "template.html",
              "README.md",
              "更新记录.md",
              "lib/advance-judge.js",
              "lib/api-system.js",
              "lib/autosave-system.js",
              "lib/char-canon.js",
              "lib/char-filter.js",
              "lib/clean-request.js",
              "lib/health-system.js",
              "lib/cleaning-system.js",
              "lib/injection-system.js",
              "lib/knowledge-matrix.js",
              "lib/offscreen-system.js",
              "lib/prompts.js",
              "lib/storage-system.js",
              "lib/story-data.js",
              "lib/timeline-system.js",
              "lib/transbook-system.js",
  "lib/transbook-bar.js",
  "lib/transbook-skin.js",
              "lib/ui-system.js",
              "lib/vector-system.js",
              "lib/world-system.js",
          ]

          # zip 里所有条目的时间戳统一，保证同一份源码重复打包字节一致
          FIXED_TIME = (2026, 10, 17, 0, 0, 0)
          SOURCE_EXT = {".js", ".css", ".html", ".md"}
          ZIP = "novel-injector-2026-10-17.zip"
          ROOT = Path(".").resolve()

          # 若仓库根真的带了 _zip_files.json（本地跑 act / 以后挪进仓库），以它为准并核对
          mirror = ROOT / "_zip_files.json"
          if mirror.is_file():
              import json
              on_disk = json.loads(mirror.read_text(encoding="utf-8"))
              if on_disk != FILES:
                  only_json = [f for f in on_disk if f not in FILES]
                  only_wf = [f for f in FILES if f not in on_disk]
                  print("❌ _zip_files.json 与 workflow 内联清单不一致")
                  if only_json or only_wf:
                      print("   仅在 json：", only_json)
                      print("   仅在 workflow：", only_wf)
                  else:
                      print("   内容相同但顺序不同 —— zip 内顺序必须与清单一致")
                  sys.exit(1)
              print("✅ 内联清单与 _zip_files.json 一致")

          missing = [f for f in FILES if not (ROOT / f).is_file()]
          if missing:
              print("❌ 清单里的文件不存在：" + ", ".join(missing))
              sys.exit(1)

          # 漏打包检查：清单外的源码文件 = 忘了加进清单
          listed = set(FILES)
          extra = []
          for p in sorted(ROOT.rglob("*")):
              if not p.is_file():
                  continue
              rel = p.relative_to(ROOT).as_posix()
              if rel.split("/")[0] in {".git", ".github", "tests", "node_modules"}:
                  continue
              if p.suffix.lower() in SOURCE_EXT and rel not in listed:
                  extra.append(rel)
          if extra:
              print("❌ 目录里有清单外的源码文件（漏打包）：" + ", ".join(extra))
              sys.exit(1)

          # 写 zip：路径就是清单里的相对路径，没有外层目录
          with zipfile.ZipFile(ZIP, "w", zipfile.ZIP_DEFLATED, compresslevel=9) as z:
              for rel in FILES:
                  info = zipfile.ZipInfo(rel, date_time=FIXED_TIME)
                  info.compress_type = zipfile.ZIP_DEFLATED
                  info.create_system = 3          # unix
                  info.external_attr = 0o644 << 16
                  z.writestr(info, (ROOT / rel).read_bytes())

          # 打完自检：条目名与顺序必须与清单完全一致
          with zipfile.ZipFile(ZIP) as z:
              names = z.namelist()
          if names != FILES:
              print("❌ zip 内容与清单不一致")
              print("   zip：", names)
              print("   清单：", FILES)
              sys.exit(1)
          if any(n.startswith("./") or n.startswith("/") for n in names):
              print("❌ zip 内出现绝对路径或 ./ 前缀")
              sys.exit(1)

          print(f"✅ {ZIP}：{len(names)} 个文件，相对路径、无外层目录、顺序与清单一致")
          for n in names:
              print("   " + n)
          PY

      - name: 校验产物（大小 / 条目数 / 可解压）
        run: |
          set -euo pipefail
          ls -l "$ZIP_NAME"
          python3 -c "import zipfile,os; z=zipfile.ZipFile(os.environ['ZIP_NAME']); print('条目数:', len(z.namelist())); print('损坏条目:', z.testzip())"
          unzip -l "$ZIP_NAME"

      - name: 创建或更新 Release 并上传 zip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，覆盖上传资产"
            gh release upload "$TAG" "$ZIP_NAME" --clobber
          else
            echo "创建 Release $TAG"
            gh release create "$TAG" "$ZIP_NAME" \
              --title "$TAG" \
              --generate-notes
          fi
          gh release view "$TAG" --json assets --jq '.assets[].name'
